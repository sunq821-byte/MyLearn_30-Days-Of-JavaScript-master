<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 调用您的函数_sum_，它接受任意数量的参数并返回总和
    function sum(...params) {
      let total = 0
      for (let i = 0; i < params.length; i++) {
        total += params[i]
      }
      return `总和为${total}`
    }
    document.write(sum(1, 2, 3, 4, 5, 6, 7, 8))
  </script>
</body>

</html>
