<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 编写一个函数**_convertRgbToHexa_**，它将rgb转换为十六进制颜色，并返回一个十六进制颜色
    function convertRgbToHexa(rgb) {
      // 步骤1：移除 'rgb(' 和 ')'
      rgb = rgb.replace('rgb(', '')
      rgb = rgb.replace(')', '')

      // 步骤2：按逗号分割为数组
      const parts = rgb.split(',');

      let r = parseInt(parts[0])
      let g = parseInt(parts[1])
      let b = parseInt(parts[2])

      // 步骤3：将RGB分量转换为十六进制字符串
      r = r.toString(16).toUpperCase().padStart(2, '0')
      g = g.toString(16).toUpperCase().padStart(2, '0')
      b = b.toString(16).toUpperCase().padStart(2, '0')

      // 构建十六进制颜色字符串
      return `#${r}${g}${b}`
    }
    document.write(convertRgbToHexa('rgb(16, 17, 255)'))
  </script>
</body>

</html>
