    function shuffleArray(arr) {
      let newArr = [...arr]

      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1))
        const temp = newArr[i]
        newArr[i] = newArr[j]
        newArr[j] = temp
      }
      return newArr
    }
    let result = shuffleArray([1, 2, 3, 4, 5])
    document.write(result)
  </script>
