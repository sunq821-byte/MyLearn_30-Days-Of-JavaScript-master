<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 编写一个函数，检查数组中的所有项是否唯一
    function isOnly(arr) {
      // 检查是否为数组
      if (!Array.isArray(arr)) {
        return '输入不是数组';
      }

      // 遍历数组
      for (let i = 0; i < arr.length; i++) {
        // 与后面的元素比较
        for (let j = i + 1; j < arr.length; j++) {
          if (arr[i] === arr[j]) {
            return `数组[${arr.join(', ')}]存在重复项，不唯一`;
          }
        }
      }

      // 所有元素都不重复
      return `数组[${arr.join(', ')}]所有项唯一`;
    }
    document.write(isOnly([1, 2, 3, 4, 5]))
    document.write('<br>')
    document.write(isOnly([1, 1, 2, 3, 3]))
  </script>
</body>

</html>
