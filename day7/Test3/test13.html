<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 编写一个名为_average_的函数，它接受一个数组参数并返回项的平均值。检查所有数组项是否为数字类型。如果不是，给出合理的反馈
    function average(arr) {
      let sum = 0
      let avg = 0
      if (Array.isArray(arr)) {
        for (let i = 0; i < arr.length; i++) {
          sum += arr[i]
        }
      } else {
        return `当前输入不是一个数组，请重新输入`
      }
      avg = sum / arr.length
      return `数组[${arr}]的平均值为：${avg}`

    }
    document.write(average('adaw'))
    document.write('<br>')
    document.write(average([1, 2, 3, 4, 5, 6, 7, 8]))
  </script>
</body>

</html>
