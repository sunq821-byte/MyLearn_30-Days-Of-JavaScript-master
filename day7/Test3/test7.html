<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 编写一个函数**_generateColors_**，它可以生成任意数量的十六进制或rgb颜色
    // console.log(generateColors('hexa', 3)) // ['#a3e12f', '#03ed55', '#eb3d2b']
    // console.log(generateColors('hexa', 1)) // '#b334ef'
    // console.log(generateColors('rgb', 3)) // ['rgb(5, 55, 175)', 'rgb(50, 105, 100)', 'rgb(15, 26, 80)']
    // console.log(generateColors('rgb', 1)) // 'rgb(33,79, 176)'
    function generateColors(type, count) {
      const colors = []
      const colorCount = Math.floor(Math.random() * count) + 1
      if (type === 'rgb') {
        for (let i = 0; i < colorCount; i++) {
          let r = Math.floor(Math.random() * 256)
          let g = Math.floor(Math.random() * 256)
          let b = Math.floor(Math.random() * 256)
          colors.push(`rgb(${r}, ${g}, ${b})`)
        }
      } else if (type === 'hexa') {
        for (let i = 0; i < colorCount; i++) {
          let r = Math.floor(Math.random() * 256)
          let g = Math.floor(Math.random() * 256)
          let b = Math.floor(Math.random() * 256)
          let hexR = r.toString(16).toUpperCase().padStart(2, '0')
          let hexG = g.toString(16).toUpperCase().padStart(2, '0')
          let hexB = b.toString(16).toUpperCase().padStart(2, '0')
          colors.push(`#${hexR}${hexG}${hexB}`);
        }
      } else {
        return '输入有误，请检查！！！'
      }
      return colors
    }

    document.write(generateColors('hexa', 5).join('<br>'))

  </script>
</body>

</html>
